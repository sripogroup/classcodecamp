name = "solar-guard"
main = "src/index.js"
compatibility_date = "2025-06-01"

# ---- ตารางเวลา (Cron ของ Cloudflare ใช้เวลา UTC เสมอ) ----
# "*/5 * * * *"  = ดึงข้อมูลทุก 5 นาที (FusionSolar จำกัดความถี่ ห้ามถี่กว่านี้)
# "30 10 * * *"  = 10:30 UTC = 17:30 น. เวลาไทย -> ส่งสรุปประจำวัน
[triggers]
crons = ["*/5 * * * *", "30 10 * * *"]

# ---- ที่เก็บสถานะ ----
# สร้างด้วย:  npx wrangler kv namespace create SOLAR_KV
# แล้วเอา id ที่ได้มาใส่ตรงนี้
[[kv_namespaces]]
binding = "SOLAR_KV"
id = "ใส่_KV_NAMESPACE_ID_ตรงนี้"

[observability]
enabled = true

# ---- ค่าตั้งที่ไม่ใช่ความลับ แก้ได้ตรงนี้หรือแก้ทีหลังในหน้าเว็บ Cloudflare ----
[vars]
SITE_NAME = "โรงงาน"
# โซนเซิร์ฟเวอร์ตามที่เห็นใน URL ของ FusionSolar (ของที่นี่คือ sg5)
FUSION_BASE = "https://sg5.fusionsolar.huawei.com"
FUSION_STATION_CODE = "NE=50174729"

# ขนาดระบบโซลาร์ที่ติดตั้ง (kWp) — ใช้เช็คว่าอินเวอร์เตอร์ยังทำงานอยู่ไหม
SYSTEM_KWP = "100"

# ทิศทางมิเตอร์: 1 = ค่าบวกคือซื้อไฟเข้า, -1 = ค่าบวกคือขายไฟออก
# วิธีเช็ค: เปิด /api/poll ตอนกลางคืน ถ้า grid ติดลบ ให้เปลี่ยนเป็น "-1"
METER_SIGN = "1"

# ====== เส้นตายของการไฟฟ้า — ส่วนที่สำคัญที่สุดในไฟล์นี้ ======
# ประเภทที่ 2 ถ้าเดือนไหนมีค่าเฉลี่ย 15 นาทีสูงสุด >= 30 kW แม้แค่ครั้งเดียว
# จะถูกย้ายไปประเภทที่ 3 และต้องต่ำกว่า 30 kW ติดต่อกัน 12 เดือนถึงจะกลับมาได้
DEMAND_LIMIT_KW = "30"     # ห้ามแตะเด็ดขาด
DEMAND_TARGET_KW = "27"    # เป้าที่ระบบคุมไว้ (เผื่อ margin 3 kW)
DEMAND_ACTION_KW = "24"    # ถึงตรงนี้เริ่มตัดโหลดอัตโนมัติ
DEMAND_RESTORE_KW = "18"   # ลงมาต่ำกว่านี้ถึงเปิดกลับ
TIER_PENALTY_PER_MONTH = "3000"   # ประเมินส่วนต่างค่าไฟถ้าโดนย้ายประเภท (บาท/เดือน)

# เกณฑ์เตือนคน (kW ของไฟที่ซื้อจากการไฟฟ้า) — ดูวิธีตั้งใน docs/ALERTING.md
WARN_IMPORT_KW = "20"
CRIT_IMPORT_KW = "26"
HYSTERESIS_KW = "3"
SUSTAIN_POLLS = "2"
RECOVER_POLLS = "3"

# ====== ตัดโหลดอัตโนมัติ ======
# off = แค่เตือนคน (เริ่มด้วยอันนี้) / dryrun = บอกว่าจะสั่งอะไรแต่ไม่สั่งจริง / on = สั่งจริง
AUTOSHED_MODE = "off"
SHED_MARGIN_KW = "2"
AUTOSHED_MIN_OFF_MIN = "10"       # ปิดแล้วต้องปิดค้างอย่างน้อยกี่นาที (กันคอมเพรสเซอร์พัง)
AUTOSHED_MIN_ON_MIN = "15"        # เปิดกลับแล้วต้องเปิดค้างอย่างน้อยกี่นาที
AUTOSHED_MAX_OFF_MIN = "30"       # ปิดต่อเนื่องนานสุด แล้วหมุนเวียนไปโซนอื่น
AUTOSHED_MAX_ZONES = "3"          # ปิดพร้อมกันได้มากสุดกี่โซน
AUTOSHED_RESTORE_GAP_MIN = "3"    # เปิดกลับห่างกันกี่นาที (กันกระชากพร้อมกัน)

# โซนที่ระบบสั่งได้ — priority น้อย = ยอมให้ปิดก่อน, protected = ห้ามแตะ
# driver "pull" = ตัวควบคุมในโรงงานมาอ่าน /api/zones เอง (แนะนำ) ดู docs/AUTOSHED.md
ZONES = '[{"id":"ac_office2","name":"แอร์ออฟฟิศชั้น 2","kw":12,"priority":1,"driver":"pull"},{"id":"ac_meeting","name":"แอร์ห้องประชุม","kw":6,"priority":2,"driver":"pull"},{"id":"pump_backup","name":"ปั๊มน้ำสำรอง","kw":7,"priority":3,"driver":"pull"},{"id":"ac_server","name":"แอร์ห้องเซิร์ฟเวอร์","kw":4,"priority":9,"driver":"pull","protected":true}]'

# กันสแปม
REPEAT_MIN = "30"
ESCALATE_MIN = "20"
ACK_SUPPRESS_MIN = "60"

# เวลาทำงาน (0 = อาทิตย์)
WORK_START_HOUR = "8"
WORK_END_HOUR = "17"
WORK_DAYS = "1,2,3,4,5,6"

# ====== งานประจำที่ต้องทำทุกวัน — ตัวกันเคสที่เคยทำให้โดนค่าไฟแพงทั้งปี ======
# เคสจริง: คนที่มีหน้าที่ปิดแอร์ตอน 15:00 ลาครึ่งวัน ไม่มีใครปิดแทน
#          กว่าจะรู้ตัวคือ 20:00 น. ช้าไป 5 ชั่วโมง
# ตัวนี้จะรู้ตั้งแต่ 15:10 โดยดูว่า "โหลดรวม" ลดลงตามที่ควรจะเป็นไหม
# expectDropKw = ผลรวม kW ของแอร์ 3 ตัวที่ต้องปิด (ควรวัดจริงด้วยแคลมป์มิเตอร์)
DAILY_TASKS = '[{"id":"ac_1500","name":"ปิดแอร์ 3 ตัว","at":"15:00","graceMin":10,"expectDropKw":8,"repeatMin":10,"giveUpMin":90,"days":[1,2,3,4,5,6],"owner":"ฝ่ายธุรการ"}]'

# เฝ้าระวังตอนเย็น-กลางคืน (อุปกรณ์เปิดค้าง)
# ตั้งเริ่ม 18:00 เพื่อจับแอร์ที่เปิดค้างตั้งแต่บ่ายให้เร็วขึ้น ไม่ต้องรอถึง 2 ทุ่ม
NIGHT_WATCH = "true"
NIGHT_START_HOUR = "18"
NIGHT_IDLE_KW = "8"

# ค่าไฟ
TARIFF_ON_PEAK = "4.5"
TARIFF_OFF_PEAK = "2.8"
USE_TOU = "false"

# รายการอุปกรณ์ที่ให้พนักงานไปปิด เรียงตาม kW ที่ลดได้
LOAD_SHED_LIST = '[{"name":"แอร์ออฟฟิศชั้น 2","kw":12,"owner":"ธุรการ"},{"name":"แอร์ห้องประชุม (ถ้าไม่มีประชุม)","kw":6,"owner":"ธุรการ"},{"name":"ปั๊มน้ำสำรอง","kw":7,"owner":"ช่างซ่อมบำรุง"},{"name":"เลื่อนเดินคอมเพรสเซอร์ตัวที่ 2","kw":15,"owner":"หัวหน้ากะ"}]'

# ---- ค่าที่เป็นความลับ ห้ามใส่ในไฟล์นี้ ให้ใช้คำสั่ง wrangler secret put ----
# npx wrangler secret put FUSION_USER
# npx wrangler secret put FUSION_SYSTEM_CODE
# npx wrangler secret put TELEGRAM_BOT_TOKEN
# npx wrangler secret put TELEGRAM_CHAT_ID
# npx wrangler secret put TELEGRAM_BOSS_CHAT_ID
# npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
# npx wrangler secret put RESEND_API_KEY      (หรือ BREVO_API_KEY)
# npx wrangler secret put MAIL_FROM
# npx wrangler secret put MAIL_TO
# npx wrangler secret put DASHBOARD_TOKEN
